name: AWS Infrastructure CI/CD

"on":
  push:
    branches:
      - infra
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the CDK Dependency
        run: |
          npm install -g aws-cdk
      - name: Install dependencies and validate project
        run: |
          npm ci
          npx cdk synth
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"
      - name: Deploy to AWS
        env:
          AWS_REGION: us-east-1
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap aws://$ACCOUNT_ID/us-east-1
          npx cdk deploy repoStack --require-approval never
          npx cdk deploy ContainerizedAppStack --require-approval never

      - name: Retrieve ALB DNS name
        run: |
          alb_dns=$(aws elbv2 describe-load-balancers --names node-app-alb-eda --query "LoadBalancers[0].DNSName" --output text)
          echo "ALB DNS: $alb_dns"
          echo "alb_dns=$alb_dns" >> "$GITHUB_OUTPUT"